apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: resource-validation-webhook
webhooks:
  - name: resource.validation.webhook.example.com
    clientConfig:
      service:
        name: webhook-server
        namespace: default
        path: "/validate"
      caBundle: 
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
    failurePolicy: Fail
    admissionReviewVersions: ["v1"]
    sideEffects: None
