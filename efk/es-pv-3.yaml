---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: es-pv-3
  labels:
    type: elasticsearch
spec:
  storageClassName: local-storage
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: /usr/share/elasticsearch/data-2
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node-1
