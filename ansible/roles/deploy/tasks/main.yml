---
- name: Apply java-app-service
  kubernetes.core.k8s: 
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('template', './app-service.yaml.j2') }}"
    state: present

- name: Apply java-app-ingress
  kubernetes.core.k8s: 
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('template', './app-ingress.yaml.j2') }}"
    state: present
  
- name: Apply java-app-hpa
  kubernetes.core.k8s: 
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('template', './app-hpa.yaml.j2') }}"
    state: present

- name: Apply java-app-deployment
  kubernetes.core.k8s: 
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('template', './app-deployment.yaml.j2') }}"
    state: present